[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myagents"
version = "0.1.0"
description = "Local multi-agent terminal orchestrator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Bryant Yang" },
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "textual>=1.0",
]

[project.scripts]
myagents = "main:main"
myagents-mcp = "myagents_mcp:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "agent_readiness",
  "clipboard_image",
  "collaboration",
  "discussion",
  "host",
  "host_backend",
  "main",
  "myagents_mcp",
  "orchestrator",
  "session_catalog",
  "session_manager",
  "session_roles",
  "tui_activity",
  "tui_completion",
  "tui_markdown",
  "tui_status",
  "workflow",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "acp*",
  "adapters*",
  "codex_app_server*",
  "control*",
  "dsh_acp*",
  "native_agent*",
  "pi_rpc*",
  "storage*",
  "workspace*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
dsh_acp = [
  "plugin/*.json",
  "plugin/*.md",
  "plugin/*.mjs",
  "plugin/*.yml",
  "plugin/scripts/*.mjs",
  "plugin/src/*.ts",
  "plugin/tests/*.ts",
]
