# Official DSH profile-bundle overlay owned by myagents. The stock base bundle
# supplies runtime services; this layer pins product state, permissions and the
# single ACP publication plugin without modifying the DSH checkout.

- id: hmr
  disabled: true

- id: settings
  config:
    path: !!js process.env.DSH_ACP_SETTINGS_FILE
    watch: false

- id: credentials
  config:
    path: !!js process.env.DSH_ACP_CREDENTIALS_FILE
    watch: false

- id: llm-pi-ai
  disabled: true

- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro
      - id: deepseek-v4-flash-vision-exp
        inputModalities: [text, image]

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_ACP_PERSISTENCE_DIR + '/sessions'
    compression: none
    packChunks: false

- id: attachment-local
  config:
    dshHome: !!js process.env.DSH_ACP_ATTACHMENT_HOME

- id: session-query-sqlite
  config:
    path: !!js process.env.DSH_ACP_PERSISTENCE_DIR + '/session-query.db'
    openAt: startup

- id: session-telemetry-otel
  disabled: true

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_ACP_PROFILE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: !!js "(process.env.DSH_ACP_PROFILE ?? 'workspace-write') === 'read-only' ? 'never' : 'ask'"

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: ask
    defaultPreset: !!js process.env.DSH_ACP_PROFILE ?? 'workspace-write'

- id: fs-sandbox
  config:
    cwd: !!js process.cwd()

- id: tools
  config:
    mode: native

- id: system-prompt
  config:
    persona: >-
      You are a coding agent inside a bounded multi-agent orchestrator. Work
      only in the ACP session workspace, obey every permission decision,
      verify changes, and report concise factual results.

# Product orchestration, goals, remote search and nested agents are owned by
# myagents rather than delegated recursively to the DSH model-facing surface.
- id: session-title-llm
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: myagents-dsh-acp-host
      name: '@myagents/dsh-acp-host'
      config:
        profile: !!js process.env.DSH_ACP_PROFILE ?? 'workspace-write'
